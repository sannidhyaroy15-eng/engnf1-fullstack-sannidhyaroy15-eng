version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: triagesync_postgres
    restart: always
    environment:
      POSTGRES_USER: triagesync
      POSTGRES_PASSWORD: triagesync_password
      POSTGRES_DB: triagesync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
